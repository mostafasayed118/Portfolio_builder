name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs of the same branch on new pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public/anonymous Supabase credentials (safe to expose in CI logs).
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  typecheck:
    name: Typecheck (libs + apps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  codegen-check:
    name: OpenAPI client drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-spec run codegen:check

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - name: Check for bare JS in the portfolio (TypeScript-only policy)
        # Fails if any .js/.jsx file exists in artifacts/portfolio without a
        # tracked .ts/.tsx twin — plain JavaScript must not slip into the
        # TypeScript codebase.
        run: pnpm --filter @workspace/scripts check-ts-twin
      - name: Check for duplicate components and code blocks
        # Fails if two shared components serve the same purpose (near-identical
        # files) or duplicate code blocks reappear (copy-pasted runs of >= 10
        # lines) anywhere in app source. New duplication fails the build.
        run: pnpm --filter @workspace/scripts check-duplication

  db-migrations:
    name: Supabase migrations (fresh DB)
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # Boots the local stack (postgres, auth, storage) and applies all
      # migrations in order. Fails if any migration errors against the
      # fresh database — the same surface the remote `supabase db push`
      # would hit on merge.
      - name: Start local Supabase stack
        run: supabase start

      # Reset discards the freshly-started DB and replays every migration
      # from scratch, proving the whole chain is idempotent and applies
      # cleanly on an empty database.
      - name: Re-apply all migrations from scratch
        run: supabase db reset

      - name: Verify expected schema exists
        run: |
          COUNT=$(docker exec supabase_db_Portfolio-Fixer psql -U postgres -d postgres -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';")
          echo "public tables: $COUNT"
          [ "$COUNT" -gt 0 ] || { echo "FAIL: no public tables after migration reset"; exit 1; }

      - name: Verify singleton guard index (migration 047)
        run: |
          COUNT=$(docker exec supabase_db_Portfolio-Fixer psql -U postgres -d postgres -tAc \
            "SELECT count(*) FROM pg_indexes WHERE indexdef LIKE '%(true)%' AND tablename = 'theme_settings';")
          echo "singleton guard indexes: $COUNT"
          [ "$COUNT" -ge 1 ] || { echo "FAIL: migration 047 singleton guard index missing"; exit 1; }

  data-integrity:
    name: Supabase duplicate scan
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    env:
      # Service-role access to read every table (same secret the E2E job uses).
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scan all tables for duplicate rows
        # scan-duplicates.ts exits 1 when any table has duplicate rows,
        # which fails this job and therefore the whole build.
        run: pnpm --filter @workspace/scripts scan-duplicates

  component-tests:
    name: Vitest component tests (admin + portfolio)
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run component tests
        run: pnpm run test -- --reporter=verbose
      - name: Upload Vitest report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-admin
          path: |
            artifacts/admin/coverage
            artifacts/admin/test-results
          if-no-files-found: ignore
          retention-days: 7

  bundle-analysis:
    name: Bundle analysis (portfolio + admin)
    runs-on: ubuntu-latest
    needs: component-tests
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build portfolio
        run: pnpm --filter @workspace/portfolio build
      - name: Build admin
        run: pnpm --filter @workspace/admin build
      - name: Check for UTF-8 BOMs (env files, env vars, bundles)
        # Fails the build if any env file, process.env value, or bundle asset
        # starts with a UTF-8 BOM — a BOM in an env value silently corrupts it
        # (e.g. VITE_SITE_URL becomes "\uFEFFhttps://…") and a BOM in a bundle
        # asset ships a non-standard first byte to production.
        run: pnpm --filter @workspace/scripts check-bom
      - name: Analyze bundle sizes
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for app in portfolio admin; do
            echo "### $app" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            du -sh "artifacts/$app/dist/public" 2>/dev/null || echo "No dist/public"
            find "artifacts/$app/dist/public" -name '*.js' -exec ls -lh {} \; 2>/dev/null
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
      - name: Bundle size regression check
        run: |
          MAX_JS_KB=300
          for app in portfolio admin; do
            for f in "artifacts/$app/dist/public/assets/"*.js; do
              size=$(stat --printf="%s" "$f" 2>/dev/null)
              if [ "$size" -gt $((MAX_JS_KB * 1024)) ]; then
                echo "WARNING: $app/$(basename $f) is $(($size / 1024))KB (limit: ${MAX_JS_KB}KB)"
              fi
            done
          done
      - name: Upload bundle analysis HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: |
            artifacts/portfolio/dist/bundle-analysis.html
            artifacts/admin/dist/bundle-analysis.html
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: component-tests
    timeout-minutes: 20
    env:
      PORT: 3001
      LOG_LEVEL: info
      VITE_API_URL: http://localhost:3001
      VITE_ADMIN_URL: http://localhost:5174
      VITE_SITE_URL: http://localhost:5173
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
      # Secrets scoped to E2E job only
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      CLERK_TEST_EMAIL: ${{ secrets.CLERK_TEST_EMAIL }}
      CLERK_TEST_PASSWORD: ${{ secrets.CLERK_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Start api-server
        run: pnpm --filter @workspace/api-server dev &
        env:
          PORT: 3001
          LOG_LEVEL: info

      - name: Wait for api-server to bind :3001
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3001/api/healthz; then
              echo "api-server up"
              exit 0
            fi
            sleep 1
          done
          echo "api-server failed to bind"
          exit 1

      - name: Start admin + portfolio dev servers
        run: pnpm --filter @workspace/admin --filter @workspace/portfolio dev &

      - name: Wait for admin :5174 and portfolio :5173
        run: |
          for port in 5173 5174; do
            for i in $(seq 1 60); do
              if curl -sf -o /dev/null "http://localhost:$port/"; then
                echo "$port up"
                break
              fi
              sleep 1
            done
          done

      - name: Run Playwright E2E tests
        run: pnpm exec playwright test --reporter=list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
