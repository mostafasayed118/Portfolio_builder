                      - type: object
                        properties:
                          data:
                            type: object
                            properties:
                              id: { type: string }
                  - $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCvSettings
      tags: [cv]
      summary: Delete CV settings and uploaded file
      security: [{ adminAuth: [] }]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessEnvelope"
                      - type: object
                        properties:
                          data:
                            type: object
                            properties:
                              message: { type: string }
                  - $ref: "#/components/schemas/ApiError"

  # ─────────────────────────────────────────────────────────────────────
  # Admin: preview
  # ─────────────────────────────────────────────────────────────────────
  /v1/admin/preview/{entityType}/{entityId}:
    get:
      operationId: previewEntity
      tags: [admin.preview]
      summary: Preview raw entity data (superadmin only)
      security: [{ adminAuth: [] }]
      parameters:
        - name: entityType
          in: path
          required: true
          schema: { type: string }
        - name: entityId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Entity data
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessEnvelope"
                      - type: object
                        properties:
                          data: { type: object }
                  - $ref: "#/components/schemas/ApiError"

  # ─────────────────────────────────────────────────────────────────────
  # Admin: audit log
  # ─────────────────────────────────────────────────────────────────────
  /v1/admin/audit:
    get:
      operationId: listAudit
      tags: [admin.audit]
      summary: List audit log entries (superadmin only)
      security: [{ adminAuth: [] }]
      parameters:
        - name: entityType
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessEnvelope"
                      - type: object
                        properties:
                          data: { $ref: "#/components/schemas/PaginatedAudit" }
                  - $ref: "#/components/schemas/ApiError"

  # ─────────────────────────────────────────────────────────────────────
  # Admin: analytics
  # ─────────────────────────────────────────────────────────────────────
  /v1/admin/analytics:
    get:
      operationId: getAnalytics
      tags: [admin.analytics]
      summary: Aggregate visitor + message stats
      security: [{ adminAuth: [] }]
      parameters:
        - name: days
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessEnvelope"
                      - type: object
                        properties:
                          data: { $ref: "#/components/schemas/AnalyticsStats" }
                  - $ref: "#/components/schemas/ApiError"

  /v1/chat/config:
    get:
      operationId: chatConfig
      tags: [chat]
      summary: Whether the public AI chat is enabled
      responses:
        "200":
          description: Chat enabled flag
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessEnvelope"
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [enabled]
                            properties:
                              enabled: { type: boolean }
                  - $ref: "#/components/schemas/ApiError"

  /v1/chat:
    post:
      operationId: chatSend
      tags: [chat]
      summary: Send a message to the public AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatMessagesInput" }
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessEnvelope"
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [reply]
                            properties:
                              reply: { type: string }
                  - $ref: "#/components/schemas/ApiError"
        "503":
          description: AI not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/admin/ai/generate:
    post:
      operationId: adminAiGenerate
      tags: [admin.ai]
      summary: Generate new site content with AI (admin)
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiGenerateInput" }
      responses:
        "200":
          description: Generated text
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessEnvelope"
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [text]
                            properties:
                              text: { type: string }
                  - $ref: "#/components/schemas/ApiError"
        "503":
          description: AI not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/admin/ai/improve:
    post:
      operationId: adminAiImprove
      tags: [admin.ai]
      summary: Rewrite/improve existing site content with AI (admin)
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiImproveInput" }
      responses:
        "200":
          description: Improved text
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessEnvelope"
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [text]
                            properties:
                              text: { type: string }
                  - $ref: "#/components/schemas/ApiError"
        "503":
          description: AI not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

components:
  schemas:
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, enum: [true] }

    ApiError:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, enum: [false] }
        message: { type: string }
        code: { type: string }
        existingId: { type: string }

    ChatMessagesInput:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          maxItems: 20
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string }

    AiGenerateInput:
      type: object
      required: [contentType]
      properties:
        contentType: { type: string, enum: [hero, about, project, skill, experience, general] }
        instructions: { type: string }
        context: { type: string }

    AiImproveInput:
      type: object
      required: [contentType, text]
      properties:
        contentType: { type: string, enum: [hero, about, project, skill, experience, general] }
        text: { type: string }
        instructions: { type: string }

    Pagination:
      type: object
      required: [total, limit, offset, hasMore]
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        hasMore: { type: boolean }

