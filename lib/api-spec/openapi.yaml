      type: object
      properties:
        ids: { type: array, items: { type: string } }

    BulkArchiveInput:
      type: object
      description: >-
        Provide exactly one of `ids` (archive a specific batch) or `filter`
        (archive every row matching the view — the same server-side status /
        preset predicates the list endpoint applies, in one statement).
      properties:
        ids: { type: array, items: { type: string } }
        filter:
          type: object
          description: The view to archive, mirroring the list endpoint's `status` / `preset`.
          properties:
            status: { type: string, enum: [unread, read, archived, spam] }
            preset:
              type: string
              enum: [unread_today, unread_or_archived, needs_reply]

    BulkUnarchiveInput:
      type: object
      description: >-
        Provide exactly one of `ids` (restore a specific batch) or `filter`
        (restore every row matching the view — the same server-side status /
        preset predicates the list endpoint applies, in one statement).
      properties:
        ids: { type: array, items: { type: string } }
        filter:
          type: object
          description: The view to restore, mirroring the list endpoint's `status` / `preset`.
          properties:
            status: { type: string, enum: [unread, read, archived, spam] }
            preset:
              type: string
              enum: [unread_today, unread_or_archived, needs_reply]

