openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Portfolio-Fixer API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: cv
  - name: images
  - name: blog
  - name: contact
  - name: admin.hero
  - name: admin.about
  - name: admin.skills
  - name: admin.projects
  - name: admin.experience
  - name: admin.certifications
  - name: admin.theme-presets
  - name: admin.posts
  - name: admin.messages
  - name: admin.contact-info
  - name: admin.theme
  - name: admin.typography
  - name: admin.seo
  - name: admin.section
  - name: admin.site
  - name: admin.users
  - name: admin.seed
  - name: admin.audit
  - name: admin.preview
  - name: admin.analytics
  - name: admin.ai
  - name: chat

paths:
  # ─────────────────────────────────────────────────────────────────────
  # Health / misc (unauthenticated, non-enveloped)
  # ─────────────────────────────────────────────────────────────────────
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /v1/csrf-token:
    get:
      operationId: getCsrfToken
      tags: [health]
      summary: Fetch a double-submit CSRF token
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"

  # ─────────────────────────────────────────────────────────────────────
  # Public CV download
  # ─────────────────────────────────────────────────────────────────────
  /v1/cv:
    get:
      operationId: downloadCv
      tags: [cv]
      summary: Download the current CV/resume PDF
      responses:
        "200":
          description: PDF file stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  # ─────────────────────────────────────────────────────────────────────
  # Public blog posts
  # ─────────────────────────────────────────────────────────────────────
  /v1/posts:
    get:
      operationId: getPublicPosts
      tags: [blog]
      summary: List published blog posts
      responses:
        "200":
          description: Published posts
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessEnvelope"
                      - type: object
                        properties:
                          data:
                            type: object
                            properties:
                              data:
                                type: array
                                items: { $ref: "#/components/schemas/BlogPostSummary" }
                              total: { type: integer }
                  - $ref: "#/components/schemas/ApiError"

  /v1/posts/{slug}:
    get:
      operationId: getPublicPost
      tags: [blog]
      summary: Get a published blog post by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Published post
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessEnvelope"
                      - type: object
                        properties:
                          data: { $ref: "#/components/schemas/BlogPost" }
                  - $ref: "#/components/schemas/ApiError"

  # ─────────────────────────────────────────────────────────────────────
  # Public contact form
  # ─────────────────────────────────────────────────────────────────────
  /v1/contact:
    post:
      operationId: submitContactForm
      tags: [contact]
      summary: Submit contact form (public)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactSubmissionInput" }
      responses:
        "200":
          description: Message submitted
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessEnvelope"
                      - type: object
                        properties:
                          data: { type: object, nullable: true }
                  - $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  # ─────────────────────────────────────────────────────────────────────
  # Image upload / metadata (admin)
  # ─────────────────────────────────────────────────────────────────────
  /v1/images/upload:
    post:
      operationId: uploadImage
      tags: [images]
      summary: Upload an image (admin only)
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                entityType: { type: string }
                entityId: { type: string }
      responses:
        "200":
          description: Uploaded
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessEnvelope"
                      - type: object
                        properties:
                          data: { $ref: "#/components/schemas/ImageUploadResult" }
                  - $ref: "#/components/schemas/ApiError"

  /v1/images/{id}/metadata:
    get:
      operationId: getImageMetadata
      tags: [images]
      summary: Get image metadata
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Image metadata
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessEnvelope"
                      - type: object
                        properties:
                          data: { $ref: "#/components/schemas/ImageMetadata" }
                  - $ref: "#/components/schemas/ApiError"

  /v1/images/{id}:
    delete:
      operationId: deleteImage
      tags: [images]
      summary: Delete an image (admin only)
      security: [{ adminAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessEnvelope"
                      - type: object
                        properties:
                          data: { type: object, nullable: true }
                  - $ref: "#/components/schemas/ApiError"

  /v1/images/reorder:
    post:
      operationId: reorderImages
      tags: [images]
      summary: Reorder images (admin only)
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ordered_ids]
              properties:
                ordered_ids: { type: array, items: { type: string } }
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessEnvelope"
                      - type: object
                        properties:
                          data: { type: object, nullable: true }
                  - $ref: "#/components/schemas/ApiError"

