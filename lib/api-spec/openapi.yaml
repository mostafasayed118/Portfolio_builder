        website: { type: string }
        _formLoadedAt: { type: integer }
        cfTurnstileToken: { type: string }

    CvSettingsInput:
      type: object
      required: [objectPath, fileName]
      properties:
        objectPath: { type: string }
        fileName: { type: string }

  securitySchemes:
